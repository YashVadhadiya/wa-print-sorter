<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>WhatsApp Print Sorter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-title">
        <svg class="header-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z"/>
        </svg>
        <h1>WhatsApp Print Sorter</h1>
      </div>
    </header>

    <div id="updateBanner" class="update-banner hidden">
      <span id="updateText">Update available</span>
      <span id="updateProgress" class="update-progress"></span>
    </div>

    <main class="main">
      <section class="settings-section">
        <h2>Settings</h2>
        <div class="setting-row">
          <label for="downloadsFolder">Downloads Folder:</label>
          <div class="folder-input">
            <input type="text" id="downloadsFolder" readonly>
            <button id="browseBtn" class="btn btn-secondary">Browse</button>
            <button id="openFolderBtn" class="btn btn-icon" title="Open folder">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
            </button>
          </div>
        </div>
        
      </section>

      <section class="extensions-section">
        <h2>Supported File Types (Auto-Download)</h2>
        <p class="extensions-list" id="extensionsList">Loading...</p>
      </section>

      <section class="connection-section">
        <div class="status-bar">
          <div class="status-info">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Connecting...</span>
          </div>
          <div class="action-buttons">
            <button id="startBtn" class="btn btn-primary" style="display:none;">Connect</button>
            <button id="stopBtn" class="btn btn-danger" disabled>Disconnect</button>
          </div>
        </div>
      </section>

      <section class="qr-section">
        <h2>Connection</h2>
        <div class="qr-container" id="qrContainer">
          <div class="qr-placeholder" id="qrPlaceholder">
            <svg viewBox="0 0 24 24" fill="currentColor" class="qr-icon">
              <path d="M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm13 2h-2v2h2v-2zm2-2h2v2h-2v-2zm-4 0h2v2h-2v-2zm2 2h2v2h-2v-2zm-2 2h2v2h-2v-2z"/>
            </svg>
            <p>Scan QR code with WhatsApp to connect</p>
          </div>
          <img id="qrImage" class="hidden" alt="QR Code">
        </div>
      </section>

      <section class="logs-section">
        <div class="logs-header">
          <h2>Activity Log</h2>
          <button id="clearLogsBtn" class="btn btn-small">Clear</button>
        </div>
        <div class="logs-container" id="logsContainer"></div>
      </section>
    </main>

    <footer class="footer">
      <span id="connectionDetail"></span>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
